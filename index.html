<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stickers AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  
  <body>
    <!-- La escena sigue llamando a un solo archivo Stickers.mind que ahora contiene las 3 imágenes -->
    <a-scene mindar-image="imageTargetSrc: ./Stickers.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Precargamos los TRES modelos 3D y les damos un ID único a cada uno -->
      <a-assets>
        <a-asset-item id="modeloSticker1" src="./KinSticker1.glb"></a-asset-item>
        <a-asset-item id="modeloSticker2" src="./KinSticker2.glb"></a-asset-item>
        <a-asset-item id="modeloSticker3" src="./KinSticker3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: La primera imagen que subiste al compilador -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="90 0 0" position="0 0 0" scale="1 1 1" src="#modeloSticker1"></a-gltf-model>
      </a-entity>

      <!-- Target 1: La segunda imagen que subiste al compilador -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="90 0 0" position="0 0 0" scale="1 1 1" src="#modeloSticker2"></a-gltf-model>
      </a-entity>

      <!-- Target 2: La tercera imagen que subiste al compilador -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model rotation="90 0 0" position="0 0 0" scale="1 1 1" src="#modeloSticker3"></a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
